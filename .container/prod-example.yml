    #   - /ying-server-storage:/app/storage
    ports:
      - '5090:5090'
    # networks:
    #   - xx

  ying-client:
    container_name: ying-client-test
    image: ying-client:1.0.0
    environment:
      PROXY_API_URL: http://host.docker.internal:5090
    ports:
      - '3000:3000'
    # networks:
    #   - xx
    depends_on:
      - ying-server
